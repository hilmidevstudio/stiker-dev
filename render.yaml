services:
  - type: web
    name: stickerdrop-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EXTRACTION_PROVIDER
        value: scrapecreators
      - key: SCRAPECREATORS_API_KEY
        sync: false
